<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf9f5">
<title>ETF Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --surface2: #e8e6dc;
    --border: rgba(20,20,19,0.09);
    --border2: rgba(20,20,19,0.18);
    --text: #141413;
    --text2: #6b6860;
    --text3: #b0aea5;
    --green: #3d6b4a;
    --green-dim: rgba(74,124,89,0.10);
    --amber: #9a6e2e;
    --amber-dim: rgba(154,110,46,0.10);
    --red: #b83228;
    --red-dim: rgba(184,50,40,0.08);
    --blue: #4a7fa8;
    --blue-dim: rgba(74,127,168,0.10);
    --orange: #d97757;
    --orange-dim: rgba(217,119,87,0.10);
    --accent: #141413;
    --radius: 12px;
    --radius-sm: 8px;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; }

  /* Header */
  .app-header { padding: 52px 20px 12px; display: flex; align-items: baseline; justify-content: space-between; }
  .app-title { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--orange); letter-spacing: 0.08em; text-transform: uppercase; }
  .month-nav { display: flex; align-items: center; gap: 12px; }
  .month-nav button { background: none; border: none; color: var(--text2); font-size: 18px; cursor: pointer; line-height: 1; padding: 4px; }
  .month-nav button:disabled { color: var(--text3); cursor: default; }
  .month-label { font-family: var(--mono); font-size: 13px; color: var(--text); min-width: 68px; text-align: center; }

  /* Content */
  .content { flex: 1; overflow-y: auto; padding: 0 16px; padding-bottom: 90px; }

  /* Summary strip */
  .summary-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 0.5px solid var(--border); border-left: 2px solid var(--orange); border-radius: var(--radius); padding: 14px 16px; }
  .stat-label { font-size: 11px; color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .stat-val { font-size: 24px; font-weight: 300; color: var(--text); font-family: var(--mono); }
  .stat-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }

  /* Big progress ring */
  .ring-wrap { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .ring-container { position: relative; width: 110px; height: 110px; }
  .ring-container svg { transform: rotate(-90deg); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-pct { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--text); }
  .ring-sub { font-size: 10px; color: var(--text3); font-family: var(--mono); }

  /* ETF cards */
  .swipe-wrap { position: relative; overflow: hidden; border-radius: var(--radius); margin-bottom: 10px; }
  .swipe-delete-bg { position: absolute; right: 0; top: 0; bottom: 0; width: 90px; background: var(--red); display: flex; align-items: center; justify-content: center; border-radius: var(--radius); }
  .swipe-delete-action { background: none; border: none; color: #fff; font-family: var(--mono); font-size: 13px; font-weight: 500; cursor: pointer; padding: 0 16px; height: 100%; width: 100%; }
  .swipe-item { position: relative; transition: transform 0.25s ease; will-change: transform; touch-action: pan-y; background: var(--surface); border-radius: var(--radius); }
  .swipe-item.swiped { transform: translateX(-90px); }
  .etf-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; transition: border-color 0.15s, transform 0.25s ease; }
  .etf-card:active { border-color: var(--border2); }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .ticker { font-family: var(--mono); font-size: 16px; font-weight: 500; color: var(--text); }
  .badge { font-size: 11px; font-family: var(--mono); padding: 3px 9px; border-radius: 20px; }
  .badge-ok { background: var(--green-dim); color: var(--green); }
  .badge-warn { background: var(--amber-dim); color: var(--amber); }
  .badge-done { background: var(--blue-dim); color: var(--blue); }
  .card-bar-bg { height: 3px; background: var(--surface2); border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
  .card-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .fill-ok { background: var(--green); }
  .fill-warn { background: var(--amber); }
  .fill-done { background: var(--blue); }
  .card-bottom { display: flex; justify-content: space-between; font-size: 12px; }
  .card-spent { color: var(--text2); font-family: var(--mono); }
  .card-remaining { color: var(--text3); font-family: var(--mono); }

  /* Buy screen */
  .screen { display: none; }
  .screen.active { display: block; }
  .screen-header { padding: 52px 20px 16px; display: flex; align-items: center; gap: 12px; }
  .back-btn { background: none; border: none; color: var(--text2); font-size: 22px; cursor: pointer; line-height: 1; padding: 4px 4px 4px 0; }
  .screen-title { font-size: 18px; font-weight: 500; color: var(--text); }

  .form-wrap { padding: 0 16px; padding-bottom: 90px; }
  .form-section { margin-bottom: 24px; }
  .form-section-label { font-size: 11px; font-family: var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }

  /* Suggestion chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 14px; border: 0.5px solid var(--border2); border-radius: 20px; font-size: 13px; font-family: var(--mono); color: var(--text2); cursor: pointer; background: transparent; transition: all 0.15s; white-space: nowrap; }
  .chip:active, .chip.selected { background: var(--surface2); color: var(--text); border-color: var(--border2); }
  .chip-remaining { font-size: 11px; color: var(--text3); margin-left: 4px; }

  /* Form fields */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-family: var(--mono); color: var(--text3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .field select, .field input, .field input[type=date] { width: 100%; background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 13px 14px; font-size: 16px; color: var(--text); font-family: var(--mono); outline: none; appearance: none; -webkit-appearance: none; }
  .field input[type=date]::-webkit-calendar-picker-indicator { opacity: 0.4; cursor: pointer; }
  .field select:focus, .field input:focus { border-color: rgba(255,255,255,0.3); }
  .field input::placeholder { color: var(--text3); }

  /* Confirm */
  .confirm-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .confirm-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid var(--border); font-size: 14px; }
  .confirm-row:last-child { border-bottom: none; padding-bottom: 0; }
  .confirm-row.total { padding-top: 12px; margin-top: 4px; }
  .confirm-key { color: var(--text3); font-family: var(--mono); font-size: 12px; }
  .confirm-val { color: var(--text); font-family: var(--mono); font-weight: 500; }

  /* Buttons */
  .btn { width: 100%; padding: 15px; border-radius: var(--radius); font-size: 15px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--border2); background: transparent; color: var(--text); font-family: var(--font); transition: all 0.15s; }
  .btn:active { transform: scale(0.98); opacity: 0.8; }
  .btn-primary { background: var(--orange); color: #ffffff; border-color: var(--orange); }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }

  /* History */
  .tx-list { padding-bottom: 90px; }
  .tx-month-group { margin-bottom: 24px; }
  .tx-month-label { font-size: 11px; font-family: var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; padding: 0 16px; margin-bottom: 8px; }
  .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 0.5px solid var(--border); }
  .tx-left { display: flex; flex-direction: column; gap: 3px; }
  .tx-ticker { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--text); }
  .tx-date { font-family: var(--mono); font-size: 11px; color: var(--text3); }
  .tx-amt { font-family: var(--mono); font-size: 14px; color: var(--text); }
  .tx-units { font-family: var(--mono); font-size: 11px; color: var(--text3); }
  .tx-cur-badge { font-family: var(--mono); font-size: 10px; color: var(--orange); background: var(--orange-dim); padding: 1px 6px; border-radius: 4px; }
  .tx-actions { display: flex; align-items: center; gap: 2px; }
  .tx-edit { background: none; border: none; color: var(--text3); font-size: 16px; cursor: pointer; padding: 4px 6px; line-height: 1; transition: color 0.15s; }
  .tx-edit:active { color: var(--orange); }
  .cur-pick-btn { flex: 1; padding: 10px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: transparent; color: var(--text2); font-family: var(--mono); font-size: 13px; cursor: pointer; }
  .cur-pick-active { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }
  .alloc-pct { font-family: var(--mono); font-size: 11px; color: var(--text3); min-width: 30px; text-align: right; flex-shrink: 0; }
  .cur-toggle { font-family: var(--mono); font-size: 10px; padding: 3px 7px; border-radius: 4px; cursor: pointer; border: 0.5px solid var(--border2); background: transparent; flex-shrink: 0; font-weight: 500; }
  .cur-aud { color: var(--text2); }
  .cur-usd { color: var(--orange); border-color: var(--orange); background: var(--orange-dim); }
  .tx-delete { background: none; border: none; color: var(--text3); font-size: 18px; cursor: pointer; padding: 4px 4px 4px 12px; }
  .empty-state { padding: 48px 16px; text-align: center; color: var(--text3); font-family: var(--mono); font-size: 13px; }
  .export-btn { display: flex; align-items: center; gap: 5px; padding: 7px 14px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: transparent; color: var(--text2); font-family: var(--mono); font-size: 12px; cursor: pointer; }
  .export-btn:active { background: var(--surface2); color: var(--text); }

  /* Settings */
  .settings-wrap { padding: 0 14px; padding-bottom: 90px; }
  .settings-section { margin-bottom: 28px; }
  .settings-title { font-size: 11px; font-family: var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .settings-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; width: 100%; }
  .settings-row { display: flex; align-items: center; padding: 11px 14px; border-bottom: 0.5px solid var(--border); gap: 8px; background: var(--surface); }
  .settings-row:last-child { border-bottom: none; }
  .settings-ticker { font-family: var(--mono); font-size: 13px; font-weight: 500; width: 44px; color: var(--text); flex-shrink: 0; }
  .settings-input { flex: 1; min-width: 0; max-width: 90px; background: transparent; border: none; font-size: 14px; font-family: var(--mono); color: var(--text); outline: none; text-align: right; }
  .settings-input::placeholder { color: var(--text3); }
  .settings-currency { font-family: var(--mono); font-size: 13px; color: var(--text3); }
  .total-row { display: flex; justify-content: space-between; padding: 14px 16px; background: var(--surface2); border-radius: var(--radius); font-family: var(--mono); font-size: 13px; }
  .total-row span:first-child { color: var(--text3); }
  .total-row span:last-child { color: var(--text); font-weight: 500; }
  .danger-btn { width: 100%; padding: 13px; border: 0.5px solid rgba(248,113,113,0.25); border-radius: var(--radius); background: transparent; color: var(--red); font-family: var(--mono); font-size: 13px; cursor: pointer; margin-top: 8px; }
  .danger-btn:active { background: var(--red-dim); }
  .clear-month-btn { width: 100%; padding: 11px; border: 0.5px solid rgba(184,50,40,0.2); border-radius: var(--radius); background: transparent; color: var(--red); font-family: var(--mono); font-size: 12px; cursor: pointer; }
  .clear-month-btn:active { background: var(--red-dim); }
  .etf-delete-btn { background: none; border: none; color: var(--text3); font-size: 20px; cursor: pointer; padding: 0 0 0 8px; line-height: 1; flex-shrink: 0; transition: color 0.15s; }
  .etf-delete-btn:active { color: var(--red); }
  .add-etf-row { display: flex; gap: 8px; align-items: center; }
  .add-etf-input { flex: 1; background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 12px 12px; font-size: 15px; color: var(--text); font-family: var(--mono); outline: none; min-width: 0; }
  .add-etf-input::placeholder { color: var(--text3); }
  .add-etf-input:focus { border-color: rgba(255,255,255,0.3); }
  .add-etf-btn { padding: 12px 16px; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: var(--mono); font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .add-etf-btn:active { opacity: 0.7; }

  /* Trade days bar */
  .trade-days-bar { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 0.5px solid var(--border); border-left: 2px solid var(--orange); border-radius: var(--radius); padding: 10px 16px; margin-bottom: 16px; }
  .trade-days-label { font-family: var(--mono); font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }
  .trade-days-count { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--text); }

  /* History view toggle */
  .view-toggle { display: flex; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); overflow: hidden; }
  .view-toggle-btn { background: transparent; border: none; padding: 6px 10px; font-size: 14px; color: var(--text3); cursor: pointer; }
  .view-toggle-btn.active { background: var(--surface2); color: var(--text); }

  /* Calendar */
  .cal-month-nav { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 12px; }
  .cal-month-title { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text); }
  .cal-month-total { font-family: var(--mono); font-size: 13px; color: var(--text2); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 16px; }
  .cal-hdr { font-family: var(--mono); font-size: 10px; color: var(--text3); text-align: center; padding: 4px 0; }
  .cal-cell { min-height: 44px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; padding: 4px 2px; position: relative; cursor: default; }
  .cal-cell.cal-has-tx { background: var(--orange-dim); cursor: pointer; }
  .cal-cell.cal-today .cal-day-num { background: var(--orange); color: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .cal-cell.cal-weekend .cal-day-num { color: var(--text3); }
  .cal-day-num { font-family: var(--mono); font-size: 12px; color: var(--text2); width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .cal-dots { display: flex; gap: 2px; margin-top: 2px; flex-wrap: wrap; justify-content: center; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
  .cal-detail-label { font-family: var(--mono); font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 0 4px; border-top: 0.5px solid var(--border); margin-bottom: 4px; }

  /* Nav */
  .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; display: flex; background: rgba(250,249,245,0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; cursor: pointer; border: none; background: none; color: var(--text3); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; transition: color 0.15s; }
  .nav-item.active { color: var(--orange); }
  .nav-icon { font-size: 20px; line-height: 1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 0; }

  /* Toast */
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 20px; padding: 10px 20px; font-family: var(--mono); font-size: 13px; color: var(--text); transition: transform 0.3s ease; z-index: 100; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Inline confirm bar */
  .confirm-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 430px; background: var(--surface); border-top: 0.5px solid var(--border2); padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 200; transition: transform 0.3s ease; display: flex; flex-direction: column; gap: 12px; }
  .confirm-bar.show { transform: translateX(-50%) translateY(0); }
  .confirm-bar-msg { font-family: var(--mono); font-size: 13px; color: var(--text); text-align: center; line-height: 1.5; }
  .confirm-bar-btns { display: flex; gap: 10px; }
  .confirm-bar-btns .btn { flex: 1; padding: 12px; }
  .btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
</style>
</head>
<body>

<div id="toast" class="toast"></div>
<div id="confirm-bar" class="confirm-bar">
  <div class="confirm-bar-msg" id="confirm-bar-msg"></div>
  <div class="confirm-bar-btns">
    <button class="btn" onclick="dismissConfirm()">Cancel</button>
    <button class="btn btn-danger" onclick="executeConfirm()">Confirm</button>
  </div>
</div>

<!-- Dashboard screen -->
<div id="screen-dashboard" class="screen active">
  <div class="app-header">
    <span class="app-title">ETF Tracker</span>
    <div class="month-nav">
      <button id="prev-month" onclick="prevMonth()">‹</button>
      <span class="month-label" id="month-label">—</span>
      <button id="next-month" onclick="nextMonth()">›</button>
    </div>
  </div>
  <div class="content" id="dashboard-content"></div>
</div>

<!-- Buy screen -->
<div id="screen-buy" class="screen">
  <div class="screen-header">
    <button class="back-btn" onclick="goScreen('dashboard')">‹</button>
    <span class="screen-title">Record buy</span>
  </div>
  <div class="form-wrap">
    <div class="form-section">
      <div class="form-section-label">Needs attention</div>
      <div class="chips" id="suggestion-chips"></div>
    </div>
    <div class="field">
      <label>ETF</label>
      <select id="buy-ticker"></select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field">
        <label>Units bought</label>
        <input type="number" id="buy-units" inputmode="decimal" placeholder="0.000" step="0.001" />
      </div>
      <div class="field">
        <label id="buy-amount-label">Amount ($AUD)</label>
        <input type="number" id="buy-amount" inputmode="decimal" placeholder="0.00" step="0.01" />
      </div>
    </div>
    <div class="field" style="margin-top:4px">
      <label>Buy date</label>
      <input type="date" id="buy-date" />
    </div>
    <button class="btn btn-primary" onclick="reviewBuy()" style="margin-top:8px">Review →</button>
  </div>
</div>

<!-- Confirm screen -->
<div id="screen-confirm" class="screen">
  <div class="screen-header">
    <button class="back-btn" onclick="goScreen('buy')">‹</button>
    <span class="screen-title">Confirm</span>
  </div>
  <div class="form-wrap">
    <div class="confirm-card" id="confirm-details"></div>
    <div class="btn-row">
      <button class="btn" onclick="goScreen('buy')">Edit</button>
      <button class="btn btn-primary" onclick="saveBuy()">Confirm ✓</button>
    </div>
  </div>
</div>

<!-- Edit screen -->
<div id="screen-edit" class="screen">
  <div class="screen-header">
    <button class="back-btn" onclick="goScreen('history')">‹</button>
    <span class="screen-title">Edit buy</span>
  </div>
  <div class="form-wrap" id="edit-form-wrap"></div>
</div>

<!-- History screen -->
<div id="screen-history" class="screen">
  <div class="screen-header" style="justify-content:space-between">
    <span class="screen-title">History</span>
    <div style="display:flex;gap:6px;align-items:center">
      <div class="view-toggle">
        <button id="toggle-list" class="view-toggle-btn active" onclick="setHistoryView('list')" aria-label="List view">☰</button>
        <button id="toggle-cal" class="view-toggle-btn" onclick="setHistoryView('calendar')" aria-label="Calendar view">⊞</button>
      </div>
      <label class="export-btn" for="csv-upload" aria-label="Import CSV">
        <span style="font-size:15px">↑</span> Import
      </label>
      <input type="file" id="csv-upload" accept=".csv" style="display:none" onchange="importCSV(event)" />

</div>

<nav class="nav">

    <span class="nav-icon">◎</span>Overview
  </button>

    <span class="nav-icon">+</span>Buy
  </button>

    <span class="nav-icon">≡</span>History
  </button>

    <span class="nav-icon">↺</span>Rollover
  </button>
  <button class="nav-item" id="nav-settings" onclick="goScreen('settings')">
    <span class="nav-icon">◈</span>Targets
  </button>

<script>
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function getTickers() { return state.tickers || Object.keys(state.targets); }

// ── State ──────────────────────────────────────────────────────────────────
function defaultState() {
  const n = new Date();
  return {
    tickers: ['IVV','VGE','QQQM','IWLD','VHY','GOLD'],
    targets: { IVV:600, VGE:400, QQQM:500, IWLD:400, VHY:300, GOLD:300 },
    currencies: { IVV:'AUD', VGE:'AUD', QQQM:'USD', IWLD:'AUD', VHY:'AUD', GOLD:'AUD' },
    transactions: [],
    viewMonth: { y: n.getFullYear(), m: n.getMonth() },
    historyView: 'list',
    holdingTickers: [],
    holdingBalances: {},
    rolloverOpeningBalances: {},
    usdToAud: 1.55
  };
}
let state;
try {
  const raw = localStorage.getItem('etf_v2');
  state = raw ? JSON.parse(raw) : defaultState();
  if (!state.tickers) state.tickers = Object.keys(state.targets);
  if (!state.currencies) { state.currencies = {}; state.tickers.forEach(t => { state.currencies[t] = 'AUD'; }); }
  if (!state.holdingTickers) state.holdingTickers = [];
  if (!state.holdingBalances) state.holdingBalances = {};
  if (!state.rolloverOpeningBalances) state.rolloverOpeningBalances = {};
  if (state.usdToAud == null) state.usdToAud = 1.55;
  // migrate old global rolloverStartBalance if present
  if (state.rolloverStartBalance !== undefined) { delete state.rolloverStartBalance; }
} catch(e) { state = defaultState(); }

function save() {
  try { localStorage.setItem('etf_v2', JSON.stringify(state)); } catch(e) {}
}

let pendingBuy = null;
let currentScreen = 'dashboard';

// ── Helpers ─────────────────────────────────────────────────────────────────
function fmt(n) { return '$' + Math.round(n).toLocaleString('en-AU'); }
function fmtCurrency(n, cur) { return (cur === 'USD' ? 'US$' : '$') + n.toLocaleString('en-AU', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function getCurrency(ticker) { return (state.currencies && state.currencies[ticker]) || 'AUD'; }
function convertToAUD(amount, currency) { return currency === 'USD' ? amount * (state.usdToAud || 1.55) : amount; }
function sanitizeTicker(s) { return s.replace(/[^A-Za-z0-9.\-]/g, '').toUpperCase().slice(0, 10); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function monthKey(y, m) { return `${y}-${String(m+1).padStart(2,'0')}`; }
function pct(s,t) { return t ? Math.min(Math.round(s/t*100), 100) : 0; }

function formatDisplayDate(isoDate) {
  if (!isoDate) return '';
  const d = new Date(isoDate + 'T00:00:00');
  return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
}

function generateId() {
  const now = new Date();
  const datePart = now.getFullYear().toString() +
    String(now.getMonth()+1).padStart(2,'0') +
    String(now.getDate()).padStart(2,'0');
  const existing = state.transactions.filter(tx =>
    typeof tx.id === 'string' && tx.id.startsWith(datePart)
  );
  const seq = String(existing.length + 1).padStart(3,'0');
  return datePart + '-' + seq;
}

function tradeDaysLeft(y, m) {
  const now = new Date();
  const isCurrentMonth = y === now.getFullYear() && m === now.getMonth();
  const lastDay = new Date(y, m + 1, 0); // last day of month
  const start = isCurrentMonth ? new Date(now.getFullYear(), now.getMonth(), now.getDate()) : new Date(y, m, 1);
  let count = 0;
  const cur = new Date(start);
  while (cur <= lastDay) {
    const dow = cur.getDay();
    if (dow !== 0 && dow !== 6) count++; // skip Sat/Sun
    cur.setDate(cur.getDate() + 1);
  }
  // subtract today if already past 4pm AEST (market closed) — approximate
  if (isCurrentMonth) {
    const hour = now.getHours();
    if (hour >= 16) count = Math.max(0, count - 1);
  }
  return count;
}

function spentMap(y, m) {
  const key = monthKey(y, m);
  const map = {};
  getTickers().forEach(t => map[t] = 0);
  state.transactions.filter(tx => tx.month === key).forEach(tx => { map[tx.ticker] = (map[tx.ticker]||0) + convertToAUD(tx.amount, tx.currency || 'AUD'); });
  return map;
}

function totalTarget() { return Object.values(state.targets).reduce((a,b)=>a+b,0); }

function regularTickers() { return getTickers().filter(t => !isHolding(t)); }
function isHolding(ticker) { return state.holdingTickers.includes(ticker); }

// ── FIFO Rollover engine ─────────────────────────────────────────────────────
// Returns a map of { ticker → runningBalance } at the start of month (y,m)
// i.e. the balance available *going into* (y,m) before that month's activity.
// Oldest unspent money consumed first; overspend produces negative balance per ticker.
function rolloverBalances(y, m) {
  const regularT = regularTickers();
  const targetMk = monthKey(y, m);

  // Collect all month keys from opening of history up to (but not including) (y,m)
  const allMks = [...new Set(state.transactions.map(tx => tx.month))].sort();
  // Also include months between first tx and targetMk that may have no txs
  const months = [];
  if (allMks.length > 0) {
    let [fy, fm] = allMks[0].split('-').map(Number);
    fm--;
    while (true) {
      const k = monthKey(fy, fm);
      if (k >= targetMk) break;
      months.push({ y: fy, m: fm, key: k });
      fm++; if (fm > 11) { fm = 0; fy++; }
    }
  }

  const balances = {};
  regularT.forEach(t => {
    let running = state.rolloverOpeningBalances[t] || 0;
    months.forEach(({ y: my, m: mm }) => {
      const spent = spentMap(my, mm);
      // net = target − spent; can be negative (overspend)
      const net = (state.targets[t] || 0) - (spent[t] || 0);
      running += net;
    });
    balances[t] = running;
  });
  return balances;
}

// Total rollover going into (y,m) — used by dashboard
function getRollover(y, m) {
  const balances = rolloverBalances(y, m);
  return Object.values(balances).reduce((a, b) => a + b, 0);
}

// Holding pool = starting balance + all monthly targets accrued - all buys ever recorded
function getHoldingBalance(ticker, asOfY, asOfM) {
  const start = parseFloat(state.holdingBalances[ticker]) || 0;
  const holdingStart = state.holdingStart?.[ticker];
  // Default to current date when asOfY/asOfM not provided
  const refNow = (asOfY == null || asOfM == null) ? new Date() : null;
  const ry = asOfY != null ? asOfY : refNow.getFullYear();
  const rm = asOfM != null ? asOfM : refNow.getMonth(); // 0-based
  let accrued = 0;
  if (holdingStart) {
    const [sy, sm] = holdingStart.split('-').map(Number);
    // sm from holdingStart is 1-based (monthKey stores m+1)
    const totalMonths = (ry - sy) * 12 + (rm - (sm - 1));
    accrued = Math.max(0, totalMonths) * (state.targets[ticker] || 0);
  }
  const totalBought = state.transactions
    .filter(tx => tx.ticker === ticker)
    .reduce((a, tx) => a + convertToAUD(tx.amount, tx.currency || 'AUD'), 0);
  return Math.max(0, start + accrued - totalBought);
}

function statusOf(spent, target) {
  const p = target ? spent/target : 0;
  if (p >= 1) return 'done';
  if (p >= 0.65) return 'warn';
  return 'ok';
}

function badgeLabel(st) { return st === 'done' ? 'Done' : st === 'warn' ? 'On track' : 'Buy'; }

let _confirmCallback = null;
let _confirmTimer = null;

function showConfirm(message, onConfirm) {
  _confirmCallback = onConfirm;
  document.getElementById('confirm-bar-msg').textContent = message;
  document.getElementById('confirm-bar').classList.add('show');
  clearTimeout(_confirmTimer);
  _confirmTimer = setTimeout(dismissConfirm, 5000);
}

function executeConfirm() {
  clearTimeout(_confirmTimer);
  dismissConfirm();
  if (_confirmCallback) { const fn = _confirmCallback; _confirmCallback = null; fn(); }
}

function dismissConfirm() {
  clearTimeout(_confirmTimer);
  _confirmCallback = null;
  document.getElementById('confirm-bar').classList.remove('show');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Screen routing ───────────────────────────────────────────────────────────
function goScreen(s) {
  ['dashboard','buy','confirm','history','settings','edit','rollover'].forEach(id => {
    document.getElementById('screen-'+id).classList.toggle('active', id === s);
    const nav = document.getElementById('nav-'+id);
    if (nav) nav.classList.toggle('active', id === s);
  });
  currentScreen = s;
  if (s === 'dashboard') renderDashboard();
  if (s === 'buy') renderBuy();
  if (s === 'confirm') renderConfirm();
  if (s === 'history') renderHistory();
  if (s === 'settings') renderSettings();
  if (s === 'edit') renderEdit();
  if (s === 'rollover') renderRollover();
}

// ── Dashboard ────────────────────────────────────────────────────────────────
function renderDashboard() {
  const { y, m } = state.viewMonth;
  const now = new Date();
  document.getElementById('month-label').textContent = MONTHS_SHORT[m] + ' ' + y;
  document.getElementById('next-month').disabled = (y === now.getFullYear() && m === now.getMonth());

  const spent = spentMap(y, m);
  const regularSpent = regularTickers().reduce((a, t) => a + (spent[t] || 0), 0);
  const regularTarget = regularTickers().reduce((a, t) => a + (state.targets[t] || 0), 0);
  const rollover = getRollover(y, m);
  const effectiveBudget = regularTarget + rollover;
  const overall = pct(regularSpent, effectiveBudget);
  const remaining = Math.max(0, effectiveBudget - regularSpent);
  const totSpent = Object.values(spent).reduce((a,b)=>a+b,0);

  // Ring circumference
  const R = 46, C = 2 * Math.PI * R;
  const dash = (overall / 100) * C;
  let ringColor = overall >= 100 ? '#4a7fa8' : overall >= 65 ? '#9a6e2e' : '#3d6b4a';

  const cards = getTickers().map(t => {
    if (isHolding(t)) {
      const pool = getHoldingBalance(t, y, m);
      const monthlyAdd = state.targets[t] || 0;
      return `<div class="swipe-wrap" id="sw-${esc(t)}">
        <div class="swipe-delete-bg">
          <button class="swipe-delete-action" onclick="deleteETFConfirm(${esc(JSON.stringify(t))})">Delete</button>
        </div>
        <div class="etf-card swipe-item" id="card-${esc(t)}" onclick="prefillBuy(${esc(JSON.stringify(t))})" data-swipe-id="${esc(t)}" data-swipe-type="card">
          <div class="card-top">
            <span class="ticker">${esc(t)}</span>
            <span class="badge badge-done">Holding</span>
          </div>
          <div class="card-bar-bg"><div class="card-bar-fill fill-done" style="width:100%"></div></div>
          <div class="card-bottom">
            <span class="card-spent">${fmt(pool)} available</span>
            <span class="card-remaining">+${fmt(monthlyAdd)}/mo</span>
          </div>
        </div>
      </div>`;
    }
    const s = spent[t], tg = state.targets[t];
    const st = statusOf(s, tg);
    const p = pct(s, tg);
    const rem = Math.max(0, tg - s);
    return `<div class="swipe-wrap" id="sw-${esc(t)}">
      <div class="swipe-delete-bg">
        <button class="swipe-delete-action" onclick="deleteETFConfirm(${esc(JSON.stringify(t))})">Delete</button>
      </div>
      <div class="etf-card swipe-item" id="card-${esc(t)}" onclick="prefillBuy(${esc(JSON.stringify(t))})" data-swipe-id="${esc(t)}" data-swipe-type="card">
        <div class="card-top">
          <span class="ticker">${esc(t)}</span>
          <span class="badge badge-${st}">${badgeLabel(st)}</span>
        </div>
        <div class="card-bar-bg"><div class="card-bar-fill fill-${st}" style="width:${p}%"></div></div>
        <div class="card-bottom">
          <span class="card-spent">${fmt(s)} spent</span>
          <span class="card-remaining">${rem > 0 ? fmt(rem)+' left' : 'target met'}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  closeAllSwipes();
  const tradeDays = tradeDaysLeft(y, m);
  const isCurrentMonth = y === now.getFullYear() && m === now.getMonth();
  const rolloverBar = rollover !== 0 ? `
    <div class="trade-days-bar" style="border-left-color:${rollover >= 0 ? 'var(--blue)' : 'var(--red)'}">
      <span class="trade-days-label">${rollover >= 0 ? 'Rolled over' : 'Overspend carried'}</span>
      <span class="trade-days-count" style="color:${rollover >= 0 ? 'var(--blue)' : 'var(--red)'};font-size:18px">${rollover >= 0 ? '+' : ''}${fmt(rollover)}</span>
    </div>` : '';

  document.getElementById('dashboard-content').innerHTML = `
    <div class="summary-strip">
      <div class="stat">
        <div class="stat-label">Invested</div>
        <div class="stat-val">${fmt(regularSpent)}</div>
        <div class="stat-sub">of ${fmt(effectiveBudget)}${rollover > 0 ? ' (incl. rollover)' : ''}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Remaining</div>
        <div class="stat-val">${fmt(remaining)}</div>
        <div class="stat-sub">${overall}% complete</div>
      </div>
    </div>
    ${rolloverBar}
    <div class="trade-days-bar">
      <span class="trade-days-label">Trade days ${isCurrentMonth ? 'remaining' : 'in month'}</span>
      <span class="trade-days-count">${tradeDays} <span style="font-size:11px;font-weight:400;color:var(--text3)">days</span></span>
    </div>
    <div class="ring-wrap">
      <div class="ring-container">
        <svg width="110" height="110" viewBox="0 0 110 110">
          <circle cx="55" cy="55" r="${R}" fill="none" stroke="rgba(20,20,19,0.07)" stroke-width="6"/>
          <circle cx="55" cy="55" r="${R}" fill="none" stroke="${ringColor}" stroke-width="6"
            stroke-dasharray="${dash.toFixed(1)} ${C.toFixed(1)}" stroke-linecap="round"/>
        </svg>
        <div class="ring-center">
          <span class="ring-pct">${overall}%</span>
          <span class="ring-sub">this month</span>
        </div>
      </div>
    </div>
    ${cards}
    <button class="clear-month-btn" onclick="resetMonth()" style="margin-top:4px">Clear ${MONTHS_SHORT[m]} ${y} buys</button>
  `;
  setTimeout(initSwipe, 0);
}

function prevMonth() {
  let { y, m } = state.viewMonth;
  m--; if (m < 0) { m = 11; y--; }
  state.viewMonth = { y, m };
  save();
  renderDashboard();
}

function nextMonth() {
  const now = new Date();
  let { y, m } = state.viewMonth;
  if (y === now.getFullYear() && m === now.getMonth()) return;
  m++; if (m > 11) { m = 0; y++; }
  state.viewMonth = { y, m };
  save();
  renderDashboard();
}

// ── Buy ──────────────────────────────────────────────────────────────────────
let selectedTicker = null;

function renderBuy() {
  const { y, m } = state.viewMonth;
  const spent = spentMap(y, m);

  // suggestions: holding ETFs show pool balance, regular ETFs show remaining
  const suggestions = getTickers()
    .map(t => {
      if (isHolding(t)) return { ticker: t, rem: getHoldingBalance(t, y, m), label: 'pool', isHolding: true };
      return { ticker: t, rem: Math.max(0, state.targets[t] - spent[t]), label: 'left', isHolding: false };
    })
    .filter(x => x.rem > 0)
    .sort((a, b) => b.rem - a.rem)
    .slice(0, 4);

  const sel = document.getElementById('buy-ticker');
  sel.innerHTML = getTickers().map(t => `<option value="${t}">${t}</option>`).join('');
  if (selectedTicker) sel.value = selectedTicker;
  else if (suggestions[0]) sel.value = suggestions[0].ticker;

  const chips = suggestions.map(s =>
    `<button class="chip" onclick="selectChip(${esc(JSON.stringify(s.ticker))})">${esc(s.ticker)}<span class="chip-remaining"> ${fmt(s.rem)} ${s.label}</span></button>`
  ).join('');
  document.getElementById('suggestion-chips').innerHTML = chips;

  // highlight matching chip
  highlightChip(sel.value);
  updateBuyCurrencyLabel(sel.value);
  sel.addEventListener('change', () => { highlightChip(sel.value); updateBuyCurrencyLabel(sel.value); });

  document.getElementById('buy-amount').value = '';
  const uEl = document.getElementById('buy-units'); if (uEl) uEl.value = '';
  const dEl = document.getElementById('buy-date');
  if (dEl && !dEl.value) {
    const t = new Date();
    dEl.value = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
  }
}

function updateBuyCurrencyLabel(ticker) {
  const cur = getCurrency(ticker);
  const lbl = document.getElementById('buy-amount-label');
  if (lbl) lbl.textContent = cur === 'USD' ? 'Amount (USD)' : 'Amount (AUD)';
}

function prefillBuy(ticker) {
  selectedTicker = ticker;
  goScreen('buy');
}

function selectChip(ticker) {
  document.getElementById('buy-ticker').value = ticker;
  highlightChip(ticker);
}

function highlightChip(ticker) {
  document.querySelectorAll('#suggestion-chips .chip').forEach(c => {
    c.classList.toggle('selected', c.textContent.trim().startsWith(ticker));
  });
}

function reviewBuy() {
  const ticker = document.getElementById('buy-ticker').value;
  const amt = parseFloat(document.getElementById('buy-amount').value);
  const units = parseFloat(document.getElementById('buy-units').value) || null;
  const buyDateVal = document.getElementById('buy-date')?.value || '';
  if (!units || units <= 0) { toast('Enter units bought to continue'); return; }
  if (!amt || amt <= 0) { toast('Enter the amount paid to continue'); return; }
  pendingBuy = { ticker, amount: amt, units, currency: getCurrency(ticker), buyDate: buyDateVal };
  goScreen('confirm');
}

function renderConfirm() {
  if (!pendingBuy) return;
  const { y, m } = state.viewMonth;
  const ticker = pendingBuy.ticker;
  const holding = isHolding(ticker);

  if (holding) {
    const pool = getHoldingBalance(ticker, y, m);
    const poolAfter = Math.max(0, pool - pendingBuy.amount);
    document.getElementById('confirm-details').innerHTML = `
      <div class="confirm-row"><span class="confirm-key">ETF</span><span class="confirm-val">${ticker} <span style="font-size:10px;color:var(--blue);background:var(--blue-dim);padding:1px 6px;border-radius:4px">Holding</span></span></div>
      <div class="confirm-row"><span class="confirm-key">Buy date</span><span class="confirm-val">${pendingBuy.buyDate ? formatDisplayDate(pendingBuy.buyDate) : '—'}</span></div>
      <div class="confirm-row"><span class="confirm-key">Amount</span><span class="confirm-val">${fmtCurrency(pendingBuy.amount, pendingBuy.currency)}</span></div>
      <div class="confirm-row"><span class="confirm-key">Currency</span><span class="confirm-val">${pendingBuy.currency === 'USD' ? '🇺🇸 USD' : '🇦🇺 AUD'}</span></div>
      ${pendingBuy.units ? `<div class="confirm-row"><span class="confirm-key">Units</span><span class="confirm-val">${pendingBuy.units.toFixed(3)}</span></div>` : ''}
      <div class="confirm-row"><span class="confirm-key">Pool before</span><span class="confirm-val">${fmt(pool)}</span></div>
      <div class="confirm-row total"><span class="confirm-key">Pool after</span><span class="confirm-val">${fmt(poolAfter)}</span></div>
    `;
    return;
  }

  const spent = spentMap(y, m);
  const s = spent[ticker];
  const tg = state.targets[ticker];
  const newSpent = s + pendingBuy.amount;
  const newRem = Math.max(0, tg - newSpent);

  document.getElementById('confirm-details').innerHTML = `
    <div class="confirm-row"><span class="confirm-key">ETF</span><span class="confirm-val">${ticker}</span></div>
    <div class="confirm-row"><span class="confirm-key">Buy date</span><span class="confirm-val">${pendingBuy.buyDate ? formatDisplayDate(pendingBuy.buyDate) : '—'}</span></div>
    <div class="confirm-row"><span class="confirm-key">Amount</span><span class="confirm-val">${fmtCurrency(pendingBuy.amount, pendingBuy.currency)}</span></div>
    <div class="confirm-row"><span class="confirm-key">Currency</span><span class="confirm-val">${pendingBuy.currency === 'USD' ? '🇺🇸 USD' : '🇦🇺 AUD'}</span></div>
    ${pendingBuy.units ? `<div class="confirm-row"><span class="confirm-key">Units</span><span class="confirm-val">${pendingBuy.units.toFixed(3)}</span></div>` : ''}
    <div class="confirm-row"><span class="confirm-key">Month</span><span class="confirm-val">${MONTHS_SHORT[m]} ${y}</span></div>
    <div class="confirm-row"><span class="confirm-key">Previously spent</span><span class="confirm-val">${fmt(s)}</span></div>
    <div class="confirm-row"><span class="confirm-key">Progress after</span><span class="confirm-val">${pct(newSpent,tg)}%</span></div>
    <div class="confirm-row total"><span class="confirm-key">Remaining after</span><span class="confirm-val">${newRem > 0 ? fmt(newRem) : '✓ target met'}</span></div>
  `;
}

function saveBuy() {
  if (!pendingBuy) return;
  const buyD = pendingBuy.buyDate ? new Date(pendingBuy.buyDate + 'T00:00:00') : new Date();
  const txMonth = monthKey(buyD.getFullYear(), buyD.getMonth());
  state.transactions.push({
    ticker: pendingBuy.ticker,
    amount: pendingBuy.amount,
    units: pendingBuy.units || null,
    currency: pendingBuy.currency || 'AUD',
    month: txMonth,
    date: buyD.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }),
    isoDate: pendingBuy.buyDate || null,
    id: generateId()
  });
  save();
  pendingBuy = null;
  selectedTicker = null;
  const buyDateEl = document.getElementById('buy-date');
  if (buyDateEl) buyDateEl.value = '';
  toast('Buy recorded ✓');
  goScreen('dashboard');
}

let editingId = null;

function openEdit(id) {
  editingId = id;
  goScreen('edit');
}

function renderEdit() {
  if (!editingId) return;
  const tx = state.transactions.find(t => String(t.id) === String(editingId));
  if (!tx) return;
  const cur = tx.currency || 'AUD';
  document.getElementById('edit-form-wrap').innerHTML = `
    <div class="field">
      <label>ETF</label>
      <select id="edit-ticker">
        ${getTickers().map(t => `<option value="${t}" ${t === tx.ticker ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field">
        <label>Units bought</label>
        <input type="number" id="edit-units" inputmode="decimal" placeholder="0.000" step="0.001"
          value="${tx.units != null ? tx.units : ''}" />
      </div>
      <div class="field">
        <label id="edit-amount-label">Amount (${cur})</label>
        <input type="number" id="edit-amount" inputmode="decimal" placeholder="0.00" step="0.01"
          value="${tx.amount}" />
      </div>
    </div>
    <div class="field">
      <label>Currency</label>
      <div style="display:flex;gap:8px">
        <button class="cur-pick-btn ${cur === 'AUD' ? 'cur-pick-active' : ''}" onclick="setEditCurrency('AUD')">🇦🇺 AUD</button>
        <button class="cur-pick-btn ${cur === 'USD' ? 'cur-pick-active' : ''}" onclick="setEditCurrency('USD')">🇺🇸 USD</button>
      </div>
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="edit-date" value="${tx.isoDate || ''}" />
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn" onclick="goScreen('history')">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save changes</button>
    </div>
  `;
}

let editCurrency = null;

function setEditCurrency(cur) {
  editCurrency = cur;
  document.querySelectorAll('.cur-pick-btn').forEach(b => {
    b.classList.toggle('cur-pick-active', b.textContent.includes(cur));
  });
  const lbl = document.getElementById('edit-amount-label');
  if (lbl) lbl.textContent = 'Amount (' + cur + ')';
}

function saveEdit() {
  const tx = state.transactions.find(t => String(t.id) === String(editingId));
  if (!tx) return;
  const ticker = document.getElementById('edit-ticker').value;
  const amount = parseFloat(document.getElementById('edit-amount').value);
  const units = parseFloat(document.getElementById('edit-units').value) || null;
  const isoDate = document.getElementById('edit-date').value; // YYYY-MM-DD
  const cur = editCurrency || tx.currency || 'AUD';

  if (!amount || amount <= 0) { toast('Enter a valid amount'); return; }

  tx.ticker = ticker;
  tx.amount = amount;
  tx.units = units;
  tx.currency = cur;
  if (isoDate) {
    const d = new Date(isoDate + 'T00:00:00');
    tx.isoDate = isoDate;
    tx.date = d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
    tx.month = monthKey(d.getFullYear(), d.getMonth());
  }

  save();
  editingId = null;
  editCurrency = null;
  toast('Buy updated ✓');
  goScreen('history');
}

// ── History ──────────────────────────────────────────────────────────────────
function setHistoryView(v) {
  state.historyView = v;
  save();
  document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('toggle-' + v);
  if (btn) btn.classList.add('active');
  renderHistory();
}

function renderHistory() {
  // sync toggle state
  setTimeout(() => {
    const v = state.historyView || 'list';
    document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('toggle-' + v);
    if (btn) btn.classList.add('active');
  }, 0);
  if ((state.historyView || 'list') === 'calendar') { renderCalendar(); return; }
  const txs = [...state.transactions].reverse();
  if (txs.length === 0) {
    document.getElementById('tx-list').innerHTML = '<div class="empty-state">No buys recorded yet.</div>';
    return;
  }

  // group by month
  const groups = {};
  txs.forEach(tx => {
    if (!groups[tx.month]) groups[tx.month] = [];
    groups[tx.month].push(tx);
  });

  let html = '';
  Object.keys(groups).sort().reverse().forEach(mk => {
    const [y, mo] = mk.split('-').map(Number);
    const label = MONTHS_SHORT[mo-1] + ' ' + y;
    const monthTotal = groups[mk].reduce((a,tx) => a+tx.amount, 0);
    html += `<div class="tx-month-group">
      <div class="tx-month-label">${label} · ${fmt(monthTotal)}</div>
      ${groups[mk].map(tx => {
        const unitPrice = tx.units && tx.amount ? tx.amount / tx.units : null;
        const cur = tx.currency || 'AUD';
        return `
        <div class="tx-item" id="tx-${esc(String(tx.id))}">
          <div class="tx-left">
            <span class="tx-ticker">${esc(tx.ticker)}</span>
            <span class="tx-date">${esc(tx.date)}</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
            <span class="tx-amt">${fmtCurrency(tx.amount, cur)}</span>
            ${tx.units ? `<span class="tx-units">${tx.units.toFixed(3)} units</span>` : ''}
            ${unitPrice ? `<span class="tx-units">${fmtCurrency(unitPrice, cur)}/unit</span>` : ''}
            ${cur !== 'AUD' ? `<span class="tx-cur-badge">${esc(cur)}</span>` : ''}
          </div>
          <div class="tx-actions">
            <button class="tx-edit" onclick="openEdit(${esc(JSON.stringify(String(tx.id)))})" aria-label="Edit">✎</button>
            <button class="tx-delete" onclick="deleteTx(${esc(JSON.stringify(String(tx.id)))})" aria-label="Delete">×</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  });
  document.getElementById('tx-list').innerHTML = html;
}

function renderCalendar() {
  const now = new Date();
  // Initialise calViewMonth if not set
  if (!state.calViewMonth) state.calViewMonth = { y: now.getFullYear(), m: now.getMonth() };
  const calY = state.calViewMonth.y;
  const calM = state.calViewMonth.m;
  const isCurrentMonth = calY === now.getFullYear() && calM === now.getMonth();

  // Build tx lookup by ISO date (YYYY-MM-DD) for selected month
  const mk = monthKey(calY, calM);
  const txsByDate = {};
  state.transactions.filter(tx => tx.month === mk).forEach(tx => {
    if (!tx.isoDate) return; // old transactions without isoDate gracefully skipped
    if (!txsByDate[tx.isoDate]) txsByDate[tx.isoDate] = [];
    txsByDate[tx.isoDate].push(tx);
  });

  const firstDay = new Date(calY, calM, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(calY, calM + 1, 0).getDate();
  const today = now.getDate();

  // Calendar grid
  let cells = '';
  ['S','M','T','W','T','F','S'].forEach(d => {
    cells += `<div class="cal-hdr">${d}</div>`;
  });
  for (let i = 0; i < firstDay; i++) cells += `<div class="cal-cell"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(calY, calM, d);
    const isoKey = `${calY}-${String(calM + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const txs = txsByDate[isoKey] || [];
    const isToday = isCurrentMonth && d === today;
    const isWeekend = dateObj.getDay() === 0 || dateObj.getDay() === 6;
    const hasTx = txs.length > 0;
    const dots = txs.slice(0, 3).map(() => `<span class="cal-dot" style="background:var(--orange)"></span>`).join('');

    cells += `<div class="cal-cell ${isToday ? 'cal-today' : ''} ${isWeekend ? 'cal-weekend' : ''} ${hasTx ? 'cal-has-tx' : ''}"
      onclick="${hasTx ? `showCalDay(${esc(JSON.stringify(isoKey))},${esc(JSON.stringify(mk))})` : ''}">
      <span class="cal-day-num">${d}</span>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }

  const monthTxs = state.transactions.filter(tx => tx.month === mk);
  const monthTotal = monthTxs.reduce((a,tx) => a + tx.amount, 0);

  document.getElementById('tx-list').innerHTML = `
    <div style="padding:0 16px">
      <div class="cal-month-nav">
        <button class="month-nav" style="background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;padding:4px" onclick="calPrevMonth()">‹</button>
        <div style="display:flex;flex-direction:column;align-items:center">
          <span class="cal-month-title">${MONTHS_SHORT[calM]} ${calY}</span>
          <span class="cal-month-total">${fmt(monthTotal)}</span>
        </div>
        <button class="month-nav" style="background:none;border:none;color:${isCurrentMonth ? 'var(--text3)' : 'var(--text2)'};font-size:18px;cursor:pointer;padding:4px" onclick="calNextMonth()" ${isCurrentMonth ? 'disabled' : ''}>›</button>
      </div>
      <div class="cal-grid">${cells}</div>
      <div id="cal-day-detail"></div>
    </div>
  `;
}

function calPrevMonth() {
  if (!state.calViewMonth) { const n = new Date(); state.calViewMonth = { y: n.getFullYear(), m: n.getMonth() }; }
  let { y, m } = state.calViewMonth;
  m--; if (m < 0) { m = 11; y--; }
  state.calViewMonth = { y, m };
  save();
  renderCalendar();
}

function calNextMonth() {
  if (!state.calViewMonth) { const n = new Date(); state.calViewMonth = { y: n.getFullYear(), m: n.getMonth() }; }
  const now = new Date();
  let { y, m } = state.calViewMonth;
  if (y === now.getFullYear() && m === now.getMonth()) return;
  m++; if (m > 11) { m = 0; y++; }
  state.calViewMonth = { y, m };
  save();
  renderCalendar();
}

  if (!mk) { const now = new Date(); mk = monthKey(now.getFullYear(), now.getMonth()); }
  const txs = state.transactions.filter(tx => tx.month === mk && tx.isoDate === isoDate);
  if (!txs.length) return;
  const rows = txs.map(tx => {
    const unitPrice = tx.units && tx.amount ? tx.amount / tx.units : null;
    const cur = tx.currency || 'AUD';
    return `
    <div class="tx-item" id="tx-${esc(String(tx.id))}">
      <div class="tx-left">
        <span class="tx-ticker">${esc(tx.ticker)}</span>
        <span class="tx-date">${esc(tx.date)}</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
        <span class="tx-amt">${fmtCurrency(tx.amount, cur)}</span>
        ${tx.units ? `<span class="tx-units">${tx.units.toFixed(3)} units</span>` : ''}
        ${unitPrice ? `<span class="tx-units">${fmtCurrency(unitPrice, cur)}/unit</span>` : ''}
        ${cur !== 'AUD' ? `<span class="tx-cur-badge">${esc(cur)}</span>` : ''}
      </div>
      <div class="tx-actions">
        <button class="tx-edit" onclick="openEdit(${esc(JSON.stringify(String(tx.id)))})" aria-label="Edit">✎</button>
        <button class="tx-delete" onclick="deleteTx(${esc(JSON.stringify(String(tx.id)))})" aria-label="Delete">×</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('cal-day-detail').innerHTML = `

    ${rows}

}

function exportCSV() {
  if (state.transactions.length === 0) { toast('No transactions to export'); return; }
  const rows = [['Record ID','Date','Month','ETF','Units','Amount','Currency']];
  [...state.transactions]
    .sort((a,b) => a.id - b.id)
    .forEach(tx => {
      rows.push([
        tx.id,
        tx.date || '',
        tx.month || '',
        tx.ticker || '',
        tx.units != null ? tx.units.toFixed(3) : '',
        tx.amount != null ? tx.amount.toFixed(2) : '',
        tx.currency || 'AUD'
      ]);
    });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const now = new Date();
  a.download = `etf-buys-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV downloaded ✓');
}

function parseCSVLine(line) {
  const fields = [];
  let i = 0;
  while (i <= line.length) {
    if (i === line.length) { fields.push(''); break; }
    if (line[i] === '"') {
      let val = '';
      i++;
      while (i < line.length) {
        if (line[i] === '"') {
          if (i + 1 < line.length && line[i + 1] === '"') { val += '"'; i += 2; }
          else { i++; break; }
        } else { val += line[i]; i++; }
      }
      fields.push(val);
      if (i < line.length && line[i] === ',') i++;
    } else {
      let start = i;
      while (i < line.length && line[i] !== ',') i++;
      fields.push(line.slice(start, i));
      if (i < line.length) i++;
    }
  }
  return fields;
}

function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) { toast('CSV appears empty'); return; }

    // Parse header to find column positions
    const header = lines[0].split(',').map(h => h.replace(/"/g,'').trim().toLowerCase());
    const col = name => header.indexOf(name);

    const idCol      = col('record id');
    const dateCol    = col('date');
    const monthCol   = col('month');
    const tickerCol  = col('etf');
    const unitsCol   = col('units');
    const amountCol  = col('amount');
    const currencyCol= col('currency');

    if (tickerCol === -1 || amountCol === -1) {
      toast('Invalid CSV format'); return;
    }

    const parseCell = v => (v || '').replace(/"/g,'').trim();

    let imported = 0, skipped = 0;
    const existingIds = new Set(state.transactions.map(tx => String(tx.id)));

    for (let i = 1; i < lines.length; i++) {
      const cells = parseCSVLine(lines[i]);
      const get = idx => idx >= 0 ? parseCell(cells[idx] || '') : '';

      const id      = get(idCol) || String(Date.now() + i);
      const ticker  = get(tickerCol).toUpperCase();
      const amount  = parseFloat(get(amountCol));
      const units   = parseFloat(get(unitsCol)) || null;
      const month   = get(monthCol);
      const date    = get(dateCol);
      const currency= get(currencyCol) || 'AUD';

      if (!ticker || isNaN(amount) || amount <= 0) { skipped++; continue; }
      if (existingIds.has(String(id))) { skipped++; continue; }

      state.transactions.push({ id, ticker, amount, units, month, date, currency });
      existingIds.add(String(id));
      imported++;
    }

    save();
    event.target.value = ''; // reset file input
    renderHistory();
    toast(`Imported ${imported} record${imported !== 1 ? 's' : ''}${skipped ? ', '+skipped+' skipped' : ''} ✓`);
  };
  reader.readAsText(file);
}

function deleteTx(id) {
  showConfirm('Remove this buy?', () => {
    state.transactions = state.transactions.filter(tx => String(tx.id) !== String(id));
    save();
    renderHistory();
  });
}

// ── Rollover ──────────────────────────────────────────────────────────────────
function renderRollover() {
  const now = new Date();
  const regularT = regularTickers();
  if (regularT.length === 0) {
    document.getElementById('rollover-content').innerHTML = '<div class="empty-state">No regular items tracked yet.</div>';
    return;
  }

  const allMonthKeys = [...new Set(state.transactions.map(tx => tx.month))].sort();
  if (allMonthKeys.length === 0) {
    document.getElementById('rollover-content').innerHTML = '<div class="empty-state">No buy history yet. Record some buys to see rollover tracking.</div>';
    return;
  }

  // Build month range from earliest tx through current month
  const firstMk = allMonthKeys[0];
  const curMk = monthKey(now.getFullYear(), now.getMonth());
  const months = [];
  let [fy, fm] = firstMk.split('-').map(Number);
  fm--;
  while (true) {
    months.push({ y: fy, m: fm, key: monthKey(fy, fm) });
    if (monthKey(fy, fm) === curMk) break;
    fm++; if (fm > 11) { fm = 0; fy++; }
  }

  // ── Per-ticker FIFO cumulative rollover ──
  // running balance after each month (net = target − spent, can be negative)
  const tickerCumulatives = {}; // ticker → { monthKey: runningBalance }
  regularT.forEach(t => {
    let running = state.rolloverOpeningBalances[t] || 0;
    tickerCumulatives[t] = {};
    months.forEach(({ key, y, m }) => {
      const spent = spentMap(y, m);
      const net = (state.targets[t] || 0) - (spent[t] || 0);
      running += net;
      tickerCumulatives[t][key] = running;
    });
  });

  // Grand total = sum of each ticker's final cumulative
  const grandTotal = regularT.reduce((a, t) => {
    const lastKey = months[months.length - 1].key;
    return a + (tickerCumulatives[t][lastKey] || 0);
  }, 0);

  // ── Summary card ──
  const openingTotal = regularT.reduce((a, t) => a + (state.rolloverOpeningBalances[t] || 0), 0);
  const isNegative = grandTotal < 0;
  let html = `
    <div style="background:var(--surface);border:0.5px solid var(--border);border-left:2px solid ${isNegative ? 'var(--red)' : 'var(--blue)'};border-radius:var(--radius);padding:14px 16px;margin-bottom:20px">
      <div style="font-family:var(--mono);font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">${isNegative ? 'Overspend carried' : 'Total available rollover'}</div>
      <div style="font-family:var(--mono);font-size:28px;font-weight:300;color:${isNegative ? 'var(--red)' : 'var(--blue)'}">
        ${grandTotal >= 0 ? '+' : ''}${fmt(grandTotal)}
      </div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:4px">${regularT.length} item${regularT.length !== 1 ? 's' : ''} · ${months.length} month${months.length !== 1 ? 's' : ''} tracked</div>
      ${openingTotal !== 0 ? `<div style="font-family:var(--mono);font-size:11px;color:var(--blue);margin-top:6px;padding-top:6px;border-top:0.5px solid var(--border)">incl. ${fmt(openingTotal)} opening balances</div>` : ''}
    </div>
  `;

  // ── Per-ticker sections ──
  regularT.forEach(t => {
    const opening = state.rolloverOpeningBalances[t] || 0;
    const lastKey = months[months.length - 1].key;
    const tickerTotal = tickerCumulatives[t][lastKey] || 0;
    const tgt = state.targets[t] || 0;
    const isExpanded = state.rolloverExpanded && state.rolloverExpanded['ticker-' + t];
    const tickerNeg = tickerTotal < 0;

    // Monthly rows for this ticker (most recent first)
    let monthRows = '';
    [...months].reverse().forEach(({ key, y, m }) => {
      const spent = spentMap(y, m);
      const s = spent[t] || 0;
      const net = tgt - s; // negative = overspend
      const cumul = tickerCumulatives[t][key] || 0;
      const pctVal = tgt > 0 ? Math.round(s / tgt * 100) : 0;
      const isOver = net < 0;
      const netColor = isOver ? 'var(--red)' : net > 0 ? 'var(--amber)' : 'var(--green)';
      const netLabel = isOver ? fmt(Math.abs(net)) + ' over' : net > 0 ? '+' + fmt(net) : '✓';
      const cumulColor = cumul < 0 ? 'var(--red)' : 'var(--text3)';
      monthRows += `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border)">
          <div>
            <span style="font-family:var(--mono);font-size:12px;color:var(--text2)">${MONTHS_SHORT[m]} ${y}</span>
            <span style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-left:8px">${fmt(s)} spent</span>
          </div>
          <div style="text-align:right">
            <span style="font-family:var(--mono);font-size:12px;color:${netColor}">${netLabel}</span>
            <span style="font-family:var(--mono);font-size:10px;color:${cumulColor};margin-left:6px">→ ${cumul >= 0 ? '+' : ''}${fmt(cumul)}</span>
          </div>
        </div>`;
    });

    html += `
    <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer"
           onclick="toggleRolloverRow(${esc(JSON.stringify('ticker-' + t))})">
        <div>
          <div style="font-family:var(--mono);font-size:14px;font-weight:500;color:var(--text)">${esc(t)}</div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:2px">${fmt(tgt)}/mo target${opening !== 0 ? ' · ' + fmt(opening) + ' opening' : ''}</div>
        </div>
        <div style="text-align:right">
          <div style="font-family:var(--mono);font-size:18px;font-weight:300;color:${tickerNeg ? 'var(--red)' : 'var(--blue)'}">
            ${tickerTotal >= 0 ? '+' : ''}${fmt(tickerTotal)}
          </div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:2px">${tickerNeg ? 'overspent' : 'available'}</div>
        </div>
      </div>
      ${isExpanded ? `
      <div style="padding:0 16px 12px;border-top:0.5px solid var(--border)">
        ${opening !== 0 ? `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border)">
          <span style="font-family:var(--mono);font-size:12px;color:var(--text3)">Opening balance</span>
          <span style="font-family:var(--mono);font-size:12px;color:${opening < 0 ? 'var(--red)' : 'var(--blue)'}">
            ${opening >= 0 ? '+' : ''}${fmt(opening)}
          </span>
        </div>` : ''}
        ${monthRows}
      </div>` : ''}
    </div>`;
  });

  document.getElementById('rollover-content').innerHTML = html;
}

function toggleRolloverRow(key) {
  if (!state.rolloverExpanded) state.rolloverExpanded = {};
  state.rolloverExpanded[key] = !state.rolloverExpanded[key];
  save();
  renderRollover();
}

    const holding = isHolding(t);

      <div class="swipe-delete-bg">
        <button class="swipe-delete-action" onclick="deleteETF(${esc(JSON.stringify(t))})">Delete</button>
      </div>
      <div class="settings-row swipe-item" id="srow-${esc(t)}" data-swipe-id="${esc(t)}" data-swipe-type="setting" style="flex-wrap:wrap;gap:6px">
        <span class="settings-ticker">${esc(t)}</span>
        <button class="cur-toggle ${cur === 'USD' ? 'cur-usd' : 'cur-aud'}" onclick="toggleCurrency(${esc(JSON.stringify(t))})">${esc(cur)}</button>
        <input class="settings-input" type="number" inputmode="decimal" value="${tgt||''}"
          placeholder="0" onchange="updateTarget(${esc(JSON.stringify(t))},this.value)" oninput="refreshTotal()" />
        <span class="alloc-pct" id="pct-${esc(t)}">${allocPct}%</span>
        <button class="cur-toggle ${holding ? 'cur-usd' : 'cur-aud'}" style="min-width:56px" onclick="toggleHolding(${esc(JSON.stringify(t))})">${holding ? 'Hold' : 'Buy'}</button>
        ${holding
          ? `<input class="settings-input" style="max-width:100px;flex:none" type="number" inputmode="decimal"
              value="${startBal}" placeholder="Start bal"
              onchange="updateHoldingBalance(${esc(JSON.stringify(t))},this.value)" />`
          : `<input class="settings-input" style="max-width:90px;flex:none;color:var(--blue)" type="number" inputmode="decimal"
              value="${rolloverOpening}" placeholder="Rollover $"
              title="Opening rollover balance for ${esc(t)}"
              onchange="updateRolloverOpening(${esc(JSON.stringify(t))},this.value)" />`
        }
      </div>
    </div>`;
  }).join('');

  closeAllSwipes();
  document.getElementById('settings-content').innerHTML = `
    <div class="settings-section">
      <div class="settings-title">Monthly $ target per ETF</div>
      <div class="settings-card" id="etf-rows">${rows}</div>
    </div>
    <div class="settings-section">
      <div class="add-etf-row">
        <input class="add-etf-input" id="new-ticker-input" type="text" placeholder="Ticker (e.g. VAS)"
          maxlength="8" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()" />
        <select class="add-etf-input" id="new-currency-input" style="width:76px;flex-shrink:0">
          <option value="AUD">AUD</option>
          <option value="USD">USD</option>
        </select>
        <input class="add-etf-input" id="new-target-input" type="number" inputmode="decimal" placeholder="$ target" style="width:90px;flex-shrink:0" />
        <button class="add-etf-btn" onclick="addETF()">Add +</button>
      </div>
    </div>
    <div class="settings-section">
      <div id="total-display" class="total-row">
        <span>Total per month</span><span>${fmt(totalTarget())}</span>
      </div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:8px;line-height:1.6;padding:0 2px">
        <span style="color:var(--blue)">Rollover $</span> — enter any unspent budget you had before you started tracking for each item. Shows in the Rollover tab.
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-title">Currency</div>
      <div class="settings-card">
        <div class="settings-row">
          <span class="settings-ticker" style="width:auto;min-width:60px;font-size:12px;color:var(--text3)">USD → AUD</span>
          <input class="settings-input" type="number" inputmode="decimal" step="0.001"
            value="${state.usdToAud || 1.55}" placeholder="1.55"
            style="max-width:90px;text-align:right"
            onchange="updateUsdRate(this.value)" />
          <span class="settings-currency">rate</span>
        </div>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-title">Targets</div>
      <button class="danger-btn" onclick="resetTargets()">Reset all targets to $0</button>
    </div>
  `;
  setTimeout(initSwipe, 0);
}

function addETF() {
  const tickerEl = document.getElementById('new-ticker-input');
  const targetEl = document.getElementById('new-target-input');
  const ticker = sanitizeTicker(tickerEl.value.trim());
  const target = parseFloat(targetEl.value) || 0;
  const currency = document.getElementById('new-currency-input')?.value || 'AUD';

  if (!ticker) { toast('Enter a ticker symbol'); return; }
  if (getTickers().includes(ticker)) { toast(ticker + ' already exists'); return; }

  state.tickers.push(ticker);
  state.targets[ticker] = target;
  if (!state.currencies) state.currencies = {};
  state.currencies[ticker] = currency;
  save();
  toast(ticker + ' added ✓');
  renderSettings();
}

function toggleCurrency(ticker) {
  if (!state.currencies) state.currencies = {};
  state.currencies[ticker] = state.currencies[ticker] === 'USD' ? 'AUD' : 'USD';
  save();
  renderSettings();
}

function toggleHolding(ticker) {
  if (isHolding(ticker)) {
    state.holdingTickers = state.holdingTickers.filter(t => t !== ticker);
    delete state.holdingBalances[ticker];
    delete state.holdingStart?.[ticker];
  } else {
    state.holdingTickers.push(ticker);
    // record the month holding mode was activated so accrual starts from here
    if (!state.holdingStart) state.holdingStart = {};
    const now = new Date();
    state.holdingStart[ticker] = monthKey(now.getFullYear(), now.getMonth());
  }
  save();
  renderSettings();
  renderDashboard();
}

function updateRolloverOpening(ticker, val) {
  if (!state.rolloverOpeningBalances) state.rolloverOpeningBalances = {};
  state.rolloverOpeningBalances[ticker] = parseFloat(val) || 0;
  save();
}

function updateHoldingBalance(ticker, val) {
  state.holdingBalances[ticker] = parseFloat(val) || 0;
  save();
}

function updateUsdRate(val) {
  state.usdToAud = parseFloat(val) || 1.55;
  save();
  renderDashboard();
}

function deleteETFConfirm(ticker) {
  resetSwipe(ticker, 'card');
  deleteETF(ticker);
}

function deleteETF(ticker) {
  const hasTx = state.transactions.some(tx => tx.ticker === ticker);
  const msg = hasTx
    ? `Remove ${ticker}? History kept — it won't show on the dashboard.`
    : `Remove ${ticker}?`;
  showConfirm(msg, () => {
    state.tickers = state.tickers.filter(t => t !== ticker);
    delete state.targets[ticker];
    state.holdingTickers = state.holdingTickers.filter(t => t !== ticker);
    delete state.holdingBalances[ticker];
    if (state.holdingStart) delete state.holdingStart[ticker];
    save();
    toast(ticker + ' removed');
    renderSettings();
    renderDashboard();
  });
}

function updateTarget(ticker, val) {
  state.targets[ticker] = parseFloat(val) || 0;
  save();
  refreshTotal();
}

function refreshTotal() {
  const tot = totalTarget();
  const el = document.getElementById('total-display');
  if (el) el.innerHTML = `<span>Total per month</span><span>${fmt(tot)}</span>`;
  getTickers().forEach(t => {
    const pctEl = document.getElementById('pct-' + t);
    if (!pctEl) return;
    const tgt = parseFloat(document.querySelector(`#srow-${t} .settings-input`)?.value) || state.targets[t] || 0;
    pctEl.textContent = tot > 0 ? Math.round(tgt / tot * 100) + '%' : '0%';
  });
}

function resetMonth() {
  const { y, m } = state.viewMonth;
  const key = monthKey(y, m);
  showConfirm(`Clear all buys for ${MONTHS_SHORT[m]} ${y}?`, () => {
    state.transactions = state.transactions.filter(tx => tx.month !== key);
    save();
    toast('Month cleared');
    renderDashboard();
  });
}

function resetTargets() {
  showConfirm('Reset all monthly targets to $0? Buy history is preserved.', () => {
    getTickers().forEach(t => { state.targets[t] = 0; });
    save();
    toast('Targets reset to $0');
    renderSettings();
  });
}


// ── Swipe to delete ──────────────────────────────────────────────────────────
let swipeState = {};

function initSwipe() {
  document.querySelectorAll('.swipe-item').forEach(el => {
    const id = el.dataset.swipeId;
    const type = el.dataset.swipeType;
    let startX = 0, startY = 0, isDragging = false, isSwiped = false;

    el.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      isDragging = false;
    }, { passive: true });

    el.addEventListener('touchmove', e => {
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (!isDragging && Math.abs(dy) > Math.abs(dx)) return; // vertical scroll
      isDragging = true;
      if (dx < 0) {
        const clamped = Math.max(dx, -90);
        el.style.transform = `translateX(${clamped}px)`;
        el.style.transition = 'none';
      } else if (isSwiped && dx > 0) {
        const clamped = Math.min(-90 + dx, 0);
        el.style.transform = `translateX(${clamped}px)`;
        el.style.transition = 'none';
      }
    }, { passive: true });

    el.addEventListener('touchend', e => {
      if (!isDragging) return;
      el.style.transition = 'transform 0.25s ease';
      const dx = e.changedTouches[0].clientX - startX;
      if (!isSwiped && dx < -40) {
        el.style.transform = 'translateX(-90px)';
        isSwiped = true;
        closeOtherSwipes(id, type);
      } else if (isSwiped && dx > 40) {
        el.style.transform = 'translateX(0)';
        isSwiped = false;
      } else {
        el.style.transform = isSwiped ? 'translateX(-90px)' : 'translateX(0)';
      }
      swipeState[id + type] = isSwiped;
    }, { passive: true });
  });

  // tap outside to close
  document.addEventListener('touchstart', e => {
    if (!e.target.closest('.swipe-item') && !e.target.closest('.swipe-delete-bg')) {
      closeAllSwipes();
    }
  }, { passive: true });
}

function closeOtherSwipes(exceptId, exceptType) {
  document.querySelectorAll('.swipe-item').forEach(el => {
    if (el.dataset.swipeId !== exceptId || el.dataset.swipeType !== exceptType) {
      el.style.transition = 'transform 0.25s ease';
      el.style.transform = 'translateX(0)';
      swipeState[el.dataset.swipeId + el.dataset.swipeType] = false;
    }
  });
}

function closeAllSwipes() {
  document.querySelectorAll('.swipe-item').forEach(el => {
    el.style.transition = 'transform 0.25s ease';
    el.style.transform = 'translateX(0)';
  });
  swipeState = {};
}

function resetSwipe(id, type) {
  const el = document.querySelector(`[data-swipe-id="${id}"][data-swipe-type="${type}"]`);
  if (el) { el.style.transform = 'translateX(0)'; }
  swipeState[id + type] = false;
}

// ── Init ─────────────────────────────────────────────────────────────────────
renderDashboard();
</script>
</body>
</html>
